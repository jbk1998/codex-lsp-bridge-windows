name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install npm trusted publishing client
        run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run ci:verify
      - name: Publish to npm with trusted publishing
        if: github.event_name == 'release' || inputs.publish == 'true'
        shell: bash
        run: |
          if npm publish --access public; then
            exit 0
          else
            status=$?
            echo "::error::npm trusted publishing failed. Configure the npm trusted publisher for codex-lsp-bridge to GitHub repository jbk1998/codex-lsp-bridge-windows and workflow .github/workflows/release.yml (no environment), then retry." >&2
            exit "$status"
          fi
